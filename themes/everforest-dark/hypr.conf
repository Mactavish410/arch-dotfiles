# Hyprland color overrides (copied to ~/.config/hypr/colors.conf)
$bg = #2d353b
$bg_alt = #343f44
$bg_dim = #232a2e
$fg = #d3c6aa
$fg_dim = #859289
$accent = #a7c080
$accent2 = #e67e80
$accent3 = #e69875
$border = #4f585e
$urgent = #e67e80
$active_border_start = #a7c080
$active_border_end = #e67e80
$inactive_border = #4f585e
$green = #a7c080
$orange = #e69875
$red = #e67e80
$blue = #7fbbb3
$purple = #d699b6

general {
    col.active_border = rgba(a7c080ee) rgba(e67e80ee) 45deg
