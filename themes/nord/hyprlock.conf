# Hyprlock theme colors
background {
    monitor =
    path =
    color = rgba(2e3440ee)
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(88c0d0)
    inner_color = rgb(3b4252)
    font_color = rgb(eceff4)
    fade_on_empty = true
    placeholder_text = <i>password</i>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
    rounding = 8
    check_color = rgb(81a1c1)
    fail_color = rgb(bf616a)
}

label {
    monitor =
    text = $TIME
    color = rgb(eceff4)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(88c0d0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}
