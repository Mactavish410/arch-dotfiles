# Hyprlock theme colors
background {
    monitor =
    path =
    color = rgba(191724ee)
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(c4a7e7)
    inner_color = rgb(1f1d2e)
    font_color = rgb(e0def4)
    fade_on_empty = true
    placeholder_text = <i>password</i>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
    rounding = 8
    check_color = rgb(ebbcba)
    fail_color = rgb(eb6f92)
}

label {
    monitor =
    text = $TIME
    color = rgb(e0def4)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(c4a7e7)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}
