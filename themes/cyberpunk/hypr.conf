# Hyprland color overrides (copied to ~/.config/hypr/colors.conf)
$bg = #0d0208
$bg_alt = #1a0a12
$bg_dim = #12050c
$fg = #e8f0ff
$fg_dim = #8a9bb0
$accent = #00f0ff
$accent2 = #ff2a6d
$accent3 = #fcee0a
$border = #2a1520
$urgent = #ff2a6d
$active_border_start = #00f0ff
$active_border_end = #ff2a6d
$inactive_border = #2a1520
$green = #39ff14
$orange = #ff9f1c
$red = #ff2a6d
$blue = #00f0ff
$purple = #bf00ff

general {
    col.active_border = rgba(00f0ffee) rgba(ff2a6dee) 45deg
    col.inactive_border = rgba(2a1520aa)
}

group {
    col.border_active = rgba(00f0ffee) rgba(ff2a6dee) 45deg
    col.border_inactive = rgba(2a1520aa)
