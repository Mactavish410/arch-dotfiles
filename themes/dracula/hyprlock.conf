# Hyprlock theme colors
background {
    monitor =
    path =
    color = rgba(282a36ee)
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(bd93f9)
    inner_color = rgb(44475a)
    font_color = rgb(f8f8f2)
    fade_on_empty = true
    placeholder_text = <i>password</i>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
    rounding = 8
    check_color = rgb(ff79c6)
    fail_color = rgb(ff5555)
}

label {
    monitor =
    text = $TIME
    color = rgb(f8f8f2)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(bd93f9)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}
