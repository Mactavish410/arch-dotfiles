# Starship prompt theme
format = "$directory$git_branch$git_status$character"

[character]
success_symbol = "[❯](bold #fe8019)"
error_symbol = "[❯](bold #fb4934)"
vimcmd_symbol = "[❮](bold #b8bb26)"

[directory]
style = "bold #fe8019"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold #b8bb26"

[git_status]
style = "bold #fabd2f"

[cmd_duration]
min_time = 2000
style = "bold #fe8019"
