# EndeavourOS — Hyprland
# Colors: source colors.conf (theme-switch). Default theme: cyberpunk.

source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/monitors.conf

# ── Environment (safe defaults; NVIDIA via nvidia.conf) ─────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORS,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# Real NVIDIA host only — uncomment after install enables it:
# source = ~/.config/hypr/nvidia.conf

# ── Autostart ───────────────────────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = swww-daemon
exec-once = waybar
exec-once = dunst
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = sh -c 'command -v nm-applet >/dev/null && nm-applet --indicator'
exec-once = sh -c 'command -v blueman-applet >/dev/null && blueman-applet'
exec-once = sh -c 'command -v kdeconnectd >/dev/null && kdeconnectd'
exec-once = sh -c 'D="$HOME/dotfiles"; [ -d "$HOME/arch-dotfiles" ] && D="$HOME/arch-dotfiles"; [ -L "$HOME/Dotfiles" ] && D="$HOME/Dotfiles"; test -f "$D/themes/.current" || "$D/scripts/theme-switch.sh" apply cyberpunk'

# ── Input ───────────────────────────────────────────────────────
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = false
        tap-to-click = true
    }
}

# ── General / decoration ────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(00000066)
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    bezier = easeInOut, 0.65, 0, 0.35, 1

    animation = windows, 1, 4, easeOut, popin 80%
    animation = windowsIn, 1, 4, easeOut, popin 80%
    animation = windowsOut, 1, 3, easeInOut, popin 80%
    animation = border, 1, 6, easeOut
    animation = borderangle, 1, 8, easeInOut, loop
    animation = fade, 1, 4, easeOut
    animation = workspaces, 1, 4, easeOut, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    vrr = 0
    enable_swallow = true
    swallow_regex = ^(kitty)$
}

cursor {
    no_hardware_cursors = true
}

gestures {
    workspace_swipe = false
}

# ── Keybinds ────────────────────────────────────────────────────
$mainMod = SUPER
$terminal = kitty
$menu = rofi -show drun
$scripts = $HOME/arch-dotfiles/scripts

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, Q, killactive,
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -p clipboard | cliphist decode | wl-copy
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, SPACE, exec, $scripts/ai_assistant.py
bind = $mainMod, T, exec, $scripts/theme-switch.sh
bind = $mainMod SHIFT, E, exec, wlogout -p layer-shell
bind = $mainMod SHIFT, R, exec, $scripts/record-screen.sh

bind = $mainMod, F, fullscreen,
bind = $mainMod, M, fullscreen, 1
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, E, exec, thunar
bind = $mainMod, B, exec, firefox
bind = $mainMod SHIFT, Space, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, K, movefocus, u

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl = , XF86AudioMute, exec, pamixer -t
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = opacity 0.95 0.95, class:^(kitty)$

layerrule = blur, waybar
layerrule = blur, rofi
layerrule = ignorezero, waybar
